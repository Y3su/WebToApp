[package]
name = "webtoapp-desktop-runtime"
version = "0.0.0"
description = "Origin-restricted WebToApp desktop runtime"
authors = ["WebToApp contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[lib]
name = "webtoapp_desktop_runtime"
crate-type = ["lib"]

[[bin]]
name = "webtoapp-desktop-runtime"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
thiserror = "2"
url = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
