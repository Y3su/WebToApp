name: WebToApp
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
targets:
  WebToApp:
    type: application
    platform: iOS
    sources:
      - path: WebToApp
        excludes: [Resources]
    resources:
      - path: WebToApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.webtoapp.runtime
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
