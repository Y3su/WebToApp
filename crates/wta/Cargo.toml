[package]
name = "wta"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.82"
description = "WebToApp command-line interface and customer-controlled build runner"
license = "Apache-2.0"
repository = "https://github.com/Y3su/WebToApp"
readme = "README.md"
keywords = ["webview", "mobile", "desktop", "app-builder"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "wta"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "0.33.0", default-features = false }
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
tempfile = "3.21.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
