name: webtoapp

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: webtoapp
      POSTGRES_USER: webtoapp
      POSTGRES_PASSWORD: webtoapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoapp -d webtoapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - webtoapp-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: webtoapp
      MINIO_ROOT_PASSWORD: replace-me-in-local-env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - webtoapp-minio:/data

volumes:
  webtoapp-postgres:
  webtoapp-minio:
