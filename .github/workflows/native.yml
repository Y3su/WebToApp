name: native runtimes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webtoapp/desktop-runtime build
      - run:
          cargo fmt --manifest-path runtimes/desktop/src-tauri/Cargo.toml
          --check
      - run:
          cargo clippy --locked --manifest-path
          runtimes/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run:
          cargo test --locked --manifest-path
          runtimes/desktop/src-tauri/Cargo.toml
      - run:
          pnpm --filter @webtoapp/desktop-runtime exec tauri build --debug
          --no-bundle
  android:
    name: Android shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - run:
          gradle -p runtimes/android :app:testDebugUnitTest :app:assembleDebug
          :app:bundleRelease
  ios:
    name: iOS shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: runtimes/ios
      - run:
          xcodebuild -project WebToApp.xcodeproj -scheme WebToApp -sdk
          iphonesimulator CODE_SIGNING_ALLOWED=NO build
        working-directory: runtimes/ios
