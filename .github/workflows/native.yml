name: native runtimes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webtoapp/desktop-runtime build
      - run:
          cargo fmt --manifest-path runtimes/desktop/src-tauri/Cargo.toml
          --check
      - run:
          cargo clippy --locked --manifest-path
          runtimes/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run:
          cargo test --locked --manifest-path
          runtimes/desktop/src-tauri/Cargo.toml
      - run:
          cargo run --locked -p wta -- build
          packages/app-spec/examples/windows-preview.json --target
          windows-project --acknowledge-preview --output-dir
          temp/windows-project
      - run: pnpm install --frozen-lockfile
        working-directory: temp/windows-project
      - run: pnpm typecheck
        working-directory: temp/windows-project
      - run: pnpm audit --audit-level moderate
        working-directory: temp/windows-project
      - name: Check exported project dependency licenses
        run: >-
          node --input-type=module -e "import {collectLicenses, checkLicenses}
          from './tooling/scripts/check-licenses.mjs';
          checkLicenses(collectLicenses('temp/windows-project/node_modules/.pnpm'));"
      - run: pnpm desktop
        working-directory: temp/windows-project
        env:
          CARGO_TARGET_DIR:
            ${{ github.workspace }}/runtimes/desktop/src-tauri/target
      - name: Verify unsigned executable and frozen resource
        shell: pwsh
        run: |
          $output = 'runtimes/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug'
          $manifest = Get-Content temp/windows-project/wta.project.json -Raw | ConvertFrom-Json
          $digest = (Get-FileHash "$output/resources/appspec.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $manifest.appSpecSha256) { throw 'Bundled AppSpec digest mismatch' }
          $signature = Get-AuthenticodeSignature "$output/webtoapp-desktop-runtime.exe"
          if ($signature.Status -ne 'NotSigned') { throw 'Preview must be unsigned' }
  android:
    name: Android shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes the retired SDK package named "tools".
          packages: platform-tools platforms;android-36
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run:
          gradle -p runtimes/android :app:testDebugUnitTest :app:assembleDebug
          :app:bundleRelease
  ios:
    name: iOS shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: runtimes/ios
      - run:
          xcodebuild -project WebToApp.xcodeproj -scheme WebToApp -sdk
          iphonesimulator CODE_SIGNING_ALLOWED=NO build
        working-directory: runtimes/ios
